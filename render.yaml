services:
  # ── Viva Backend API — Web Service ────────────────────────────────────────
  - type: web
    name: viva-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --timeout-keep-alive 30
    pullRequestPreviewsEnabled: false
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://admin.vivamatrimony.in,https://vivamatrimony.in
      - key: APP_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256

  # ── Viva Landing / Email Callback — Static Site ───────────────────────────
  - type: web
    name: viva-landing
    runtime: static
    rootDir: landing
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /auth/callback
        destination: /auth/callback/index.html

  # ── Viva Admin Panel — Static Site ────────────────────────────────────────
  - type: web
    name: viva-admin
    runtime: static
    rootDir: viva-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.vivamatrimony.in/api/v1
