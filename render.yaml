services:
  # ── Viva Landing / Email Callback — Static Site ───────────────────────────
  - type: web
    name: viva-landing
    runtime: static
    rootDir: landing
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /auth/callback
        destination: /auth/callback/index.html

  # ── Viva Admin Panel — Static Site ────────────────────────────────────────
  - type: web
    name: viva-admin
    runtime: static
    rootDir: viva-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.vivamatrimony.in/api/v1
