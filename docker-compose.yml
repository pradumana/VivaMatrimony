version: "3.9"

services:
  # ──────────────────────────────────────────────
  # FastAPI Backend
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: viva_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/app/utils/fonts:/app/app/utils/fonts
    networks:
      - viva_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ──────────────────────────────────────────────
  # Nginx reverse proxy (production)
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: viva_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # SSL certs from certbot
      - ./logs/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - viva_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  viva_net:
    driver: bridge

volumes:
  nginx_logs:
