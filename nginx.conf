user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # ── Security headers ─────────────────────────────────────────────────
    server_tokens off;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # ── Rate limiting zones ───────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_otp:10m      rate=5r/h;
    limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=20r/m;

    # ── Upstream ─────────────────────────────────────────────────────────
    upstream viva_backend {
        server backend:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
    server {
        listen 80;
        server_name api.yourdomain.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS API server ──────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.yourdomain.com;

        # SSL (managed by certbot)
        ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Request limits ────────────────────────────────────────────────
        client_max_body_size 25M;   # Allow photo/document uploads up to 25MB

        # ── Health check (no rate limit) ──────────────────────────────────
        location /health {
            proxy_pass http://viva_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── OTP endpoint (strict rate limit) ─────────────────────────────
        location ~ ^/api/v1/auth/send-otp {
            limit_req zone=api_otp burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://viva_backend;
            include /etc/nginx/proxy_params;
        }

        # ── Auth endpoints ────────────────────────────────────────────────
        location ~ ^/api/v1/auth {
            limit_req zone=api_auth burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://viva_backend;
            include /etc/nginx/proxy_params;
        }

        # ── API docs (disable in production by returning 404) ─────────────
        location ~ ^/(docs|redoc|openapi.json) {
            return 404;
        }

        # ── All other API routes ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://viva_backend;
            include /etc/nginx/proxy_params;
        }

        # ── Block direct Supabase credential exposure ─────────────────────
        location ~ \.(env|py|sql)$ {
            return 403;
        }

        # ── 404 fallback ─────────────────────────────────────────────────
        location / {
            return 404 '{"detail":"Not found"}';
            add_header Content-Type application/json;
        }
    }
}
