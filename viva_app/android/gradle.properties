org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.configureondemand=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Disable Kotlin incremental compilation globally.
# Required because Flutter plugin Kotlin sources live in C:\Users\...\Pub\Cache
# while the build outputs are on D:\android\... — Kotlin's incremental cache
# cannot store relative paths across different Windows drive roots and crashes.
kotlin.incremental=false
kotlin.daemon.useFallbackStrategy=false
